<form [formGroup]="form" (submit)="submit()" class="flex flex-col gap-4 p-2 w-full max-w-sm">

    <div>
        <tui-textfield tuiTextfieldSize="m">
            <label tuiLabel>Holiday Name <span class="text-red-500">*</span></label>
            <input formControlName="title" placeholder="e.g. Christmas Day" tuiInput />
        </tui-textfield>
        <tui-error formControlName="title" />
    </div>

    <div class="grid grid-cols-2 gap-3">
        <div>
            <tui-textfield tuiTextfieldSize="m">
                <label tuiLabel>Start Date <span class="text-red-500">*</span></label>
                <input formControlName="startDate" tuiInputDate placeholder="DD.MM.YYYY" />
                <tui-calendar *tuiDropdown />
            </tui-textfield>
            <tui-error formControlName="startDate" />
        </div>

        <div>
            <tui-textfield tuiTextfieldSize="m">
                <label tuiLabel>End Date <span class="text-red-500">*</span></label>
                <input formControlName="endDate" tuiInputDate placeholder="DD.MM.YYYY" />
                <tui-calendar *tuiDropdown />
            </tui-textfield>
            <tui-error formControlName="endDate" />
            @if (hasError('endDate', 'dateRange') || form.hasError('dateRange')) {
            <tui-error>End date cannot be before start date</tui-error>
            }
        </div>
    </div>

    <div>
        <tui-textfield tuiTextfieldSize="m" tuiChevron [tuiTextfieldCleaner]="false">
            <label tuiLabel>Type <span class="text-red-500">*</span></label>
            <input formControlName="type" tuiSelect />
            <tui-data-list-wrapper *tuiDropdown [items]="typeOptions" />
        </tui-textfield>
        <tui-error formControlName="type" />
    </div>

    <footer class="flex justify-end gap-3 pt-4 border-t border-(--background_dark)/10">
        <button tuiButton type="button" appearance="outline" size="m" (click)="cancel()">
            Cancel
        </button>
        <button tuiButton type="submit" size="m">
            Save Holiday
        </button>
    </footer>
</form>
