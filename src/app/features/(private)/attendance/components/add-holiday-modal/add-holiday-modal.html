<form [formGroup]="form" (submit)="submit()" class="flex flex-col gap-4 p-2 w-full">

    <div>
        <tui-textfield tuiTextfieldSize="m">
            <label tuiLabel>Title <span class="text-red-500">*</span></label>
            <input formControlName="title" placeholder="e.g. Independence Day" tuiInput />
        </tui-textfield>
        <tui-error formControlName="title" />
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="flex flex-col gap-1 text-sm text-(--primary)">
                Start Date <span class="text-red-500">*</span>
                <input type="date" formControlName="startDate"
                    class="rounded-md border border-(--secondary)/40 bg-transparent px-2 py-1.5" />
            </label>
        </div>

        <div>
            <label class="flex flex-col gap-1 text-sm text-(--primary)">
                End Date <span class="text-red-500">*</span>
                <input type="date" formControlName="endDate"
                    class="rounded-md border border-(--secondary)/40 bg-transparent px-2 py-1.5" />
            </label>
            @if (form.get('endDate')?.hasError('dateRange')) {
            <span class="text-xs text-red-500">End date cannot be before start date.</span>
            }
        </div>
    </div>

    <div>
        <label class="flex flex-col gap-1 text-sm text-(--primary)">
            Type
            <select formControlName="type" class="rounded-md border border-(--secondary)/40 bg-transparent px-2 py-1.5">
                @for (opt of typeOptions; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
                }
            </select>
        </label>
    </div>

    <label tuiLabel class="cursor-pointer">
        <input formControlName="isOptional" tuiCheckbox type="checkbox" />
        Optional holiday
    </label>

    <footer class="flex justify-end gap-3 pt-4 border-t border-(--background_dark)/10">
        <button tuiButton type="button" appearance="outline" size="m" (click)="cancel()">
            Cancel
        </button>
        <button tuiButton type="submit" size="m">
            Save Holiday
        </button>
    </footer>
</form>
