<form [formGroup]="form" (submit)="submit()" class="flex flex-col gap-4 p-2 w-full">
    <p class="text-sm text-(--primary)/70">Adjusting leave balance for <strong>{{ employeeName }}</strong></p>

    <div>
        <tui-textfield tuiTextfieldSize="m" class="bg-(--background_light)/40!" tuiChevron
            [tuiTextfieldCleaner]="false">
            <label tuiLabel>Leave Type <span class="text-red-500">*</span></label>
            <input tuiSelect placeholder="Select leave type" [formControl]="form.controls.leaveTypeId" />
            <tui-data-list *tuiDropdown>
                @for (type of leaveTypes; track type.id) {
                <button tuiOption [value]="type.id">
                    {{ type.name }}
                </button>
                }
            </tui-data-list>
        </tui-textfield>
    </div>

    <div>
        <tui-textfield tuiTextfieldSize="m">
            <label tuiLabel>Adjustment (Days) <span class="text-red-500">*</span></label>
            <input formControlName="adjustmentDays" tuiInputNumber placeholder="e.g. 1 or -1" />
        </tui-textfield>
        <tui-error formControlName="adjustmentDays" />
        <p class="text-xs text-(--primary)/60 mt-1">Use a positive number to add days, negative to deduct.</p>
    </div>

    <div>
        <tui-textfield tuiTextfieldSize="m">
            <label tuiLabel>Reason <span class="text-red-500">*</span></label>
            <textarea formControlName="reason" tuiTextarea placeholder="Reason for this adjustment"></textarea>
        </tui-textfield>
        <tui-error formControlName="reason" />
    </div>

    <footer class="flex justify-end gap-3 pt-4 border-t border-(--background_dark)/10">
        <button tuiButton type="button" appearance="outline" size="m" class="btn-lift" (click)="cancel()">
            Cancel
        </button>
        <button tuiButton type="submit" size="m" class="btn-lift">
            Submit Adjustment
        </button>
    </footer>
</form>
