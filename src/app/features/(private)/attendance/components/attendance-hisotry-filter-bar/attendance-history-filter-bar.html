<div class="flex flex-wrap items-end gap-3 bg-(--secondary)/20 p-4 rounded-lg">
    <div class="flex flex-col gap-1">
        <label class="text-xs text-(--theme1) font-medium">Employee ID</label>
        <input type="text" placeholder="Enter employee ID"
            class="border border-(--theme3)/40 rounded-md px-3 py-1.5 text-sm min-w-48 outline-none focus:border-(--theme1)"
            [ngModel]="draft().employeeId" (ngModelChange)="onEmployeeIdChange($event)" />
    </div>

    <div class="flex flex-col gap-1">
        <label class="text-xs text-(--theme1) font-medium">Start Date</label>
        <input type="date"
            class="border border-(--theme3)/40 rounded-md px-3 py-1.5 text-sm outline-none focus:border-(--theme1)"
            [ngModel]="draft().startDate" (ngModelChange)="onStartDateChange($event)" />
    </div>

    <div class="flex flex-col gap-1">
        <label class="text-xs text-(--theme1) font-medium">End Date</label>
        <input type="date"
            class="border border-(--theme3)/40 rounded-md px-3 py-1.5 text-sm outline-none focus:border-(--theme1)"
            [ngModel]="draft().endDate" (ngModelChange)="onEndDateChange($event)" />
    </div>

    <div class="flex gap-2">
        <button type="button" tuiButton size="s" [disabled]="!canSearch" (click)="onSearch()"
            class="cursor-pointer bg-(--theme3)! text-white hover:bg-(--theme3)/80! disabled:opacity-40! disabled:cursor-not-allowed!">
            Search
        </button>

        <button type="button" tuiButton size="s" appearance="flat" (click)="onReset()"
            class="cursor-pointer text-(--theme1)!">
            Reset
        </button>
    </div>
</div>
