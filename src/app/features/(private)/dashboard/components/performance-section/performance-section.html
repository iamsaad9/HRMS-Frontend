<div tuiCardLarge class="drop-shadow-sm bg-(--secondary)/20!">
  <div class="flex items-center justify-start gap-2">
    <mat-icon class="text-(--theme2)!">track_changes</mat-icon>
    <div>
      <h1 class="text-xl! text-(--primary)! font-bold! flex justify-start items-center">
        My Performance
      </h1>
      <span class="text-sm text-(--primary)/80">Track your overall performance.</span>
    </div>
  </div>

  <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
    <!-- CARD 1: My Performance Analytics (Spans 2 columns on large screens) -->

    <!-- CARD 2: Team Members Card (Spans 1 column) -->
    <div tuiCardLarge class="flex flex-col rounded-xl bg-(--background_light)! p-6 shadow-sm lg:col-span-1">
      <!-- Header -->
      <div class="flex items-center justify-between border-b border-(--secondary) pb-4">
        <div>
          <h3 class="text-lg font-bold text-(--theme2)">Team Members</h3>
          <p class="text-xs text-(--primary)/80">Direct reports & presence status</p>
        </div>
        <span class="rounded-full bg-(--secondary) px-2.5 py-0.5 text-xs font-semibold text-(--primary)">
          {{ teamMembers().length }} Members
        </span>
      </div>

      <!-- Member List -->
      <div class="mt-4 flex flex-col divide-y divide-(--secondary)">
        @for (member of teamMembers(); track member.id) {
        <div class="flex items-center justify-between py-3">
          <div class="flex items-center gap-x-3">
            <!-- Taiga Avatar / Fallback -->
            <div class="relative">
              <div tuiAvatar="@tui.user"></div>
              <!-- Presence indicator -->
              <span
                class="absolute bottom-0 right-0 h-2.5 w-2.5 rounded-full ring-2 ring-(--background_light) dark:ring-slate-900"
                [ngClass]="{
                    'bg-(--success)': member.status === 'online',
                    'bg-amber-500': member.status === 'busy',
                    'bg-slate-300': member.status === 'leave',
                  }"></span>
            </div>

            <div>
              <p class="text-sm font-semibold text-(--primary) leading-none">
                {{ member.name }}
              </p>
              <p class="mt-1 text-xs text-(--primary)/80">
                {{ member.role }}
              </p>
            </div>
          </div>

          <!-- Attendance Badge -->
          <div class="text-right">
            <span class="text-xs font-medium text-(--primary)">
              {{ member.attendanceRate }}
            </span>
            <p class="text-[10px] text-(--primary)">Attendance</p>
          </div>
        </div>
        }
      </div>

      <!-- Action Button -->
      <button tuiButton
        class="mt-auto w-full rounded-lg border py-2! text-center text-sm font-semibold text-(--background_light) transition bg-(--theme2) cursor-pointer hover:scale-102 block-0!">
        View All Team Analytics
      </button>
    </div>
  </div>
</div>
