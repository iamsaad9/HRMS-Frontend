<div class="flex  gap-5"> <!-- CARD 1: Headcount Target with TuiProgressCircle -->


  <div tuiCardLarge
    class="drop-shadow-sm bg-(--secondary)/10! shadow-[0_0_5px_rgba(0,0,0,0.2)]! gap-2! glass-card flex-1">
    <div tuiHeader class="flex items-center justify-between">
      <span class="text-sm font-medium text-(--theme2)">Total Headcount</span>
      <span class="rounded-full bg-emerald-100 px-2 py-0.5 text-xs font-semibold text-emerald-700">92.5% Target</span>
    </div>

    <div class="mt-4 flex items-center justify-between">
      <div>
        <h2 class="text-3xl font-bold">148</h2>
        <p class="mt-1 text-xs text-(--primary)">160 planned positions</p>
      </div>


    </div>
  </div>

  <!-- CARD 2: Today's Attendance with TuiRingChart -->
  <div tuiCardLarge
    class="drop-shadow-sm bg-(--secondary)/10! shadow-[0_0_5px_rgba(0,0,0,0.2)]! gap-2! glass-card flex-1">
    <div tuiHeader class="flex items-center justify-between">
      <span class="text-sm font-medium text-(--theme2)">Today's Attendance</span>
      <span class="text-xs font-semibold text-emerald-600">92.5% Present</span>
    </div>

    <div class="mt-2 flex items-center justify-between">
      <div>
        <h2 class="text-3xl font-bold">137</h2>
        <p class="mt-1 text-xs text-(--primary)">4 Leave • 8 Absent</p>
      </div>

      <!-- Taiga UI Ring Chart -->
      <div class="flex items-center justify-center gap-2">
        <tui-ring-chart class="h-24! w-24!" [value]="attendanceValues()" [(activeItemIndex)]="activeItemIndex">
          <span>{{ sum | tuiAmount: 'RUB' }}</span>
          <div>{{ label }}</div>
        </tui-ring-chart>
      </div>
    </div>
  </div>

  <!-- CARD 3: Monthly Payroll Sparkline with TuiLineChart -->
  <div tuiCardLarge
    class="drop-shadow-sm bg-(--secondary)/10! shadow-[0_0_5px_rgba(0,0,0,0.2)]! gap-2! glass-card flex-1">
    <div tuiHeader class="flex items-center justify-between">
      <span class="text-sm font-medium text-(--theme2)">Monthly Payroll</span>
      <span class="text-xs font-semibold text-amber-600">+2.4% MoM</span>
    </div>

    <div class="mt-3 flex items-end justify-between">
      <div>
        <h2 class="text-3xl font-bold">$184.5k</h2>
        <p class="mt-1 text-xs text-(--primary)">Payout: Aug 30</p>
      </div>
    </div>
  </div>

  <!-- CARD 4: Pending Approvals Action Card -->
  <div tuiCardLarge
    class="drop-shadow-sm bg-(--secondary)/10! shadow-[0_0_5px_rgba(0,0,0,0.2)]! gap-2! glass-card flex-1">
    <div tuiHeader class="flex items-center justify-between">
      <span class="text-sm font-medium text-(--theme2)">Pending Approvals</span>
      <span class="rounded-full bg-red-200 px-2.5 py-0.5 text-xs font-semibold text-red-500">Action Needed</span>
    </div>

    <div class="mt-4 flex items-center justify-between">
      <div>
        <h2 class="text-3xl font-bold">7</h2>
        <p class="mt-1 text-xs text-(--primary)">4 Leaves • 3 Expenses</p>
      </div>

      <!-- Taiga UI Progress Circle for Actioned Ratio -->
      <tui-progress-circle size="m" class="text-red-300!" [value]="0.6"></tui-progress-circle>
    </div>
  </div>
</div>
