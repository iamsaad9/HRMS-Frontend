<form
  [formGroup]="form"
  (ngSubmit)="onSubmit($event)"
  class="flex flex-col gap-3 w-full p-4 text-(--theme2)"
>
  <header>
    <h3 tuiTitle="m">
      Employee Details
      <span tuiSubtitle>Step 1 of 3 — Personal & Basic Employment Information</span>
    </h3>
  </header>

  <!-- Full Name & Email -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <tui-textfield>
        <label tuiLabel>Full Name *</label>
        <input formControlName="fullName" placeholder="e.g. John Doe" tuiInput />
      </tui-textfield>
      <tui-error formControlName="fullName" />
    </div>

    <div>
      <tui-textfield>
        <label tuiLabel>Work Email *</label>
        <input formControlName="email" type="email" placeholder="john.doe@company.com" tuiInput />
      </tui-textfield>
      <tui-error formControlName="email" />
    </div>
  </div>

  <!-- Phone & Date of Birth -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <tui-textfield>
        <label tuiLabel>Phone Number *</label>
        <input formControlName="phone" tuiInputPhone mask="+7 ### ###-##-##" autocomplete="tel" />
      </tui-textfield>
      <tui-error formControlName="phone" />
    </div>

    <div>
      <tui-textfield>
        <label tuiLabel>Date of Birth *</label>
        <input formControlName="dob" placeholder="DD.MM.YYYY" tuiInputDate />
        <tui-calendar *tuiDropdown />
      </tui-textfield>
      <tui-error formControlName="dob" />
    </div>
  </div>

  <!-- Department Selection -->
  <div>
    <tui-textfield tuiChevron [tuiTextfieldCleaner]="false">
      <label tuiLabel>Department *</label>
      <input formControlName="department" tuiSelect />
      <tui-data-list-wrapper *tuiDropdown [items]="departments" />
    </tui-textfield>
    <tui-error formControlName="department" />
  </div>

  <!-- Employment Type (Radio Group) -->
  <div class="flex flex-col gap-2">
    <label class="text-sm font-semibold text-gray-700">Employment Type</label>
    <div tuiGroup [collapsed]="true" class="w-full">
      <label tuiBlock>
        Full-Time
        <input
          type="radio"
          formControlName="employmentType"
          value="full-time"
          tuiRadio
          [style.margin-inline-start]="'auto'"
        />
      </label>
      <label tuiBlock>
        Part-Time / Contract
        <input
          type="radio"
          formControlName="employmentType"
          value="part-time"
          tuiRadio
          [style.margin-inline-start]="'auto'"
        />
      </label>
    </div>
  </div>

  <!-- Checkbox Preferences -->
  <fieldset class="flex flex-col gap-2 border-0 pb-5 m-0">
    <label tuiLabel class="cursor-pointer">
      <input formControlName="isRemote" tuiCheckbox type="checkbox" />
      Remote Worker
    </label>
    <label tuiLabel class="cursor-pointer">
      <input formControlName="requireVisa" tuiCheckbox type="checkbox" />
      Requires Work Visa Sponsorship
    </label>
  </fieldset>

  <!-- Submit Action -->
  <footer class="flex justify-end gap-3 pt-4 border-t border-(--background_dark)/10">
    <button tuiButton type="submit" class="gap-0!" size="m" [disabled]="form.invalid">
      Continue to Work Experience <mat-icon>keyboard_arrow_right</mat-icon>
    </button>
  </footer>
</form>
