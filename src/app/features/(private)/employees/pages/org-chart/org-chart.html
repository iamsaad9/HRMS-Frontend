<div class="flex flex-col gap-5 w-full p-4 md:p-5  max-w-7xl mx-auto">

    <app-main-heading title="Company Org Chart" description="{{ totalHeadcount() }} people across the organization" />


    <div #scrollContainer
        class="w-full  max-h-[75vh] rounded-xl  border border-(--secondary)/40 bg-(--secondary)/10 shadow-[0_0_5px_rgba(0,0,0,0.2)]! p-8 select-none overflow-hidden "
        [class.cursor-grabbing]="isDragging()" [class.cursor-grab]="!isDragging()" (mousedown)="onDragStart($event)"
        (wheel)="onWheelZoom($event)">
        <div class="origin-top transition-transform duration-75" [style.transform]="'scale(' + zoom() + ')'">
            @if (isLoading()) {
            <p class="text-sm text-(--primary)/60 text-center">Loading org chart…</p>
            } @else if (roots().length === 0) {
            <div class="flex flex-col items-center justify-center gap-1 py-10 text-(--primary)/70">
                <tui-icon icon="@tui.circle-alert" style="font-size: 2.5rem;" />
                <p class="text-sm font-medium m-0">No employees to display</p>
            </div>
            } @else {
            <div class="flex gap-12 justify-center min-w-max">
                @for (root of roots(); track root.employee.id) {
                <app-org-chart-node [node]="root" [isRoot]="true" />
                }
            </div>
            }
        </div>
    </div>
</div>
