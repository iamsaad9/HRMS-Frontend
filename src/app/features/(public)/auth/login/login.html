<div class="h-screen w-full overflow-hidden flex bg-linear-to-br from-[#F3E8D0] via-[#9E8660] to-[#800202]">
  <div
    class="relative w-full lg:w-1/2 z-50 flex items-center justify-center lg:justify-start p-8 lg:p-16 xl:pl-36 min-h-screen shadow-md">
    <!-- Animated Background Layer -->
    <div class="bg-bubbles">
      <ul>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="w-full max-w-md relative z-10 text-[#1d1d1d] -m-10">
      <div class="flex items-center justify-start gap-5">
        <div class="mb-8 relative">

          <div class="flex flex-col">
            <img src="https://as-suffa.org/wp-content/uploads/2021/04/as-suffa-master-logo.png" alt="Company_Logo"
              class="w-52 rounded-none mb-5 bg-transparent text-(--background_light) absolute -top-24" />


            <h1 class="text-4xl font-semibold mb-2">
              Back to Your Journey
            </h1>

            <p class="text-[#3f3d41]">

              Everything Your Team Needs, All in One Platform

            </p>
          </div>
        </div>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-3">

        <!-- LOGIN (unchanged) -->
        <div>
          <label for="email" class="block text-sm mb-1 font-medium">Email Address</label>
          <input id="email" type="email" placeholder="you@example.com" name="email" formControlName="email"
            [class.border-red-700]="hasError('email')"
            class="w-full px-4 py-3 border border-[#3f3d41] rounded-full placeholder-[#3f3d41] focus:outline-none focus:border-primary transition-colors" />
          @if (hasError('email')) {
          <p class="text-red-700 text-xs mt-1 ml-3 font-medium">
            {{ getErrorMessage('email') }}
          </p>
          }
        </div>

        <div>
          <label for="password" class="block text-sm mb-1 font-medium">Password</label>
          <div class="relative">
            <input id="password" [type]="showPassword() ? 'text' : 'password'" placeholder="Password" name="password"
              formControlName="password" [class.border-red-700]="hasError('password')"
              class="w-full px-4 py-3 border border-[#3f3d41] rounded-full placeholder-[#3f3d41] focus:outline-none focus:border-primary transition-colors pr-12" />
            <button type="button" [disabled]="isLoading()" (click)="togglePasswordVisibility()"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-[#3f3d41] hover:text-(--secondary)/70 bg-transparent border-none cursor-pointer flex items-center justify-center">
              @if (!showPassword()) {
              <mat-icon>visibility</mat-icon>
              } @else {
              <mat-icon>visibility_off</mat-icon>
              }
            </button>
          </div>
          @if (hasError('password')) {
          <p class="text-red-700 text-xs mt-1 ml-3 font-medium">
            {{ getErrorMessage('password') }}
          </p>
          }
          <a routerLink="/reset-password"
            class="text-sm rounded-xl text-[#3f3d41] hover:text-[#1d1d1d] font-bold cursor-pointer hover:underline inline-block mt-3">
            Forgot password?
          </a>
        </div>

        <button type="submit" [disabled]="isLoading()"
          class="w-full text-lg py-2 bg-linear-to-r from-(--theme2)/70 to-(--theme2)  hover:scale-102 text-black shadow-sm hover:shadow-lg font-medium rounded-xl cursor-pointer transition-all disabled:opacity-50 disabled:cursor-not-allowed">
          @if (isLoading()) {
          <div class="flex items-center justify-center gap-2">
            <span
              class="animate-spin rounded-full h-4 w-4 border-2 border-(--background_light) border-t-transparent"></span>
            <span>Signing in...</span>
          </div>
          } @else {
          Sign In
          }
        </button>
      </form>
    </div>

    <span class="absolute bottom-5 left-5 text-[#1d1d1d] text-sm z-10">Developed by VergeDesk Solutions © 2026</span>
  </div>

  <div class="hidden lg:flex lg:w-1/2 bg-linear-to-b from-[#1d1d1d] to-silver-500">
    <img [src]="'/images/slideshow/login.png'" alt="Slide" class="w-full h-full object-cover" />
  </div>
</div>
