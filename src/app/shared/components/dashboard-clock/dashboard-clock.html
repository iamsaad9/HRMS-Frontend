<div class="flex gap-2 items-center rounded-xl px-4 py-3 shadow-sm bg-(--secondary)">
  <mat-icon class="text-(--theme3)! dark:text-(--theme1)!">access_time</mat-icon>

  <div class="flex flex-col items-start justify-center">
    <div class="flex items-center gap-2">
      <span class="text-md font-semibold text-(--primary) tabular-nums">
        {{ currentTime() | date: 'mediumTime' }}
      </span>
    </div>
    <span class="text-xs font-medium text-(--primary)/50 tracking-wide uppercase">
      {{ currentTime() | date: 'EEEE, MMM d' }}
    </span>
  </div>
</div>
