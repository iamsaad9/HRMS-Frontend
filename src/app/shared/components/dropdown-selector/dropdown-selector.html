@if (dropDownItem().childItems) {
<!-- Dropdown Trigger Button -->
<button class="text-(--background_dark) lg:text-white text-shadow-lg text-base cursor-pointer flex items-center"
  type="button" [tuiDropdown]="dropdownContent" [tuiDropdownManual]="open()" [tuiObscuredEnabled]="open()"
  (click)="toggleDropdown()" (tuiActiveZoneChange)="onActiveZone($event)" (tuiObscured)="onObscured($event)">

  <div class="flex items-center justify-center">
    <mat-icon class="scale-60 lg:scale-80">{{ dropDownItem().icon }}</mat-icon>
    <span class="text-sm xl:text-base line-clamp-1"> {{ dropDownItem().title }}</span>
    <mat-icon class="scale-80 font-light">keyboard_arrow_down</mat-icon>
  </div>

  <ng-template #dropdownContent>
    <tui-data-list tuiDataListDropdownManager class="bg-(--background_light)">
      @for (item of dropDownItem().childItems; track item.title) {
      @if (item.childItems) {
      <button tuiOption tuiDropdownAuto tuiDropdownHover tuiDropdownAlign="end" [tuiDropdown]="subMenu"
        [tuiDropdownSided]="isMobile() ? false : true" type="button"
        class="p-2 w-full flex justify-start hover:bg-(--secondary)/50!">
        <div class="flex items-center justify-center gap-2 text-(--background_dark)">
          <mat-icon class="scale-80">{{ item.icon }}</mat-icon>
          <span tuiTitle class="text-xs lg:text-sm">
            {{ item.title }}
            <span tuiSubtitle class="text-[0.7rem] lg:text-xs text-(--background_dark)!">
              {{ item.description }}
            </span>
          </span>
          @if (item.childItems) {
          <mat-icon class="scale-60 lg:scale-80 font-light">keyboard_arrow_right</mat-icon>
          }
        </div>

        <ng-template #subMenu>
          <tui-data-list class="bg-(--background_light)">
            @for (subItem of item.childItems; track subItem.title) {
            <button tuiOption (click)="navigateTo(subItem.routeTo)" type="button"
              class="p-2 w-full flex flex-col items-start! justify-center! hover:bg-(--secondary)/50!">
              <div class="flex flex-row items-start justify-start gap-2 text-(--background_dark)!">
                <mat-icon class="scale-80">{{ subItem.icon }}</mat-icon>
                <span tuiTitle class="text-[0.8rem] sm:text-xs lg:text-sm">
                  {{ subItem.title }}
                  <span tuiSubtitle class="text-[0.7rem] lg:text-xs text-(--primary)!">
                    {{ subItem.description }}
                  </span>
                </span>
                @if (subItem.childItems) {
                <mat-icon class="scale-80 font-light">keyboard_arrow_right</mat-icon>
                }
              </div>
            </button>
            }
          </tui-data-list>
        </ng-template>
      </button>
      } @else {
      <button tuiOption (click)="navigateTo(item.routeTo)" type="button"
        class="p-2 w-full flex flex-col items-start! text-(--theme)! hover:bg-(--primary)/10!">
        <div class="flex items-center justify-start gap-2">
          <mat-icon class="scale-60 lg:scale-80">{{ item.icon }}</mat-icon>
          <span tuiTitle class="text-xs lg:text-sm">
            {{ item.title }}
            <span tuiSubtitle class="text-[0.7rem] lg:text-xs text-(--primary)/50!">
              {{ item.description }}
            </span>
          </span>
        </div>
      </button>
      }
      }
    </tui-data-list>
  </ng-template>
</button>
} @else {
<!-- Standard Direct-Navigation Button (No Dropdown Directives) -->
<button class="text-(--background_dark) lg:text-white text-shadow-lg text-base cursor-pointer flex items-center"
  type="button" (click)="navigateTo(dropDownItem().routeTo)">
  <div class="flex items-center justify-center">
    <mat-icon class="scale-60 lg:scale-80">{{ dropDownItem().icon }}</mat-icon>
    <span class="text-sm xl:text-base line-clamp-1"> {{ dropDownItem().title }}</span>
  </div>
</button>
}
