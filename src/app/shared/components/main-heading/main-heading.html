<div class="w-full  flex justify-between items-center gap-5 py-2 border-b-2 border-(--primary)/20">
  <div class="relative  flex flex-col justify-center  gap-1">
    <tui-icon icon="@tui.chevron-left" (click)="goBack()"
      class="cursor-pointer absolute! text-(--theme1) -left-14  p-5 rounded-lg hover:bg-(--primary)/10">
    </tui-icon>
    <h1 class="text-2xl text-(--theme1) text-shadow-2xs font-semibold">
      {{ title() }}
    </h1>
    <span class="text-(--primary)"> {{ description() }} </span>
  </div>

  <ng-content />
</div>
