<header
  class="flex justify-between w-full h-14 items-center gap-3 bg-linear-to-r from-(--theme) to-(--primary) px-3 sm:px-4 text-(--secondary) shadow-lg"
>
  <!-- Mobile menu toggle -->

  <button
    class="lg:hidden items-center text-sm font-medium transition-opacity hover:opacity-90 cursor-pointer"
    [attr.aria-expanded]="navMenuOpen()"
    [tuiDropdown]="dropdownNav"
    [tuiDropdownManual]="navMenuOpen()"
    [tuiObscuredEnabled]="navMenuOpen()"
    (click)="openNavMenu()"
    (tuiActiveZoneChange)="onActiveZone($event)"
    (tuiObscured)="onObscured($event)"
  >
    <mat-icon (click)="menuToggle.emit()">menu</mat-icon>
    <ng-template #dropdownNav>
      <tui-data-list class="bg-(--theme)/50">
        @for (item of mockDropdownItems; track item.title) {
          <button tuiOption type="button">
            <app-dropdown-selector [dropDownItem]="item" [isMobile]="true" />
          </button>
        }
      </tui-data-list>
    </ng-template>
  </button>

  <!-- @for (item of mockDropdownItems; track item.title) {
        <app-dropdown-selector [dropDownItem]="item" />
      } -->

  <!-- Left Side -->
  <div class="flex gap-3 xl:gap-5">
    <!-- Logo -->
    <div class="flex shrink-0 items-center gap-2">
      <div
        class="grid h-8 w-8 place-items-center rounded-md bg-(--secondary) text-[#1B1E27] font-semibold"
      >
        S
      </div>
    </div>

    <!-- Navbar -->
    <nav class="hidden lg:flex gap-2 lg:gap-3 xl:gap-5 items-center">
      @for (item of mockDropdownItems; track item.title) {
        <app-dropdown-selector [dropDownItem]="item" />
      }
    </nav>
  </div>

  <!-- Right Side -->
  <div class="flex flex-1 gap-2 xl:gap-5 justify-end items-center">
    <!-- Search -->
    <div class="hidden lg:flex justify-end px-1 flex-1">
      <div class="relative w-full max-w-md">
        <label
          class="bg-(--secondary) relative flex w-full items-center gap-2 rounded-lg border px-3 py-1.5 transition-colors"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            class="shrink-0 text-(--primary)"
          >
            <circle cx="11" cy="11" r="6.5" />
            <path d="m20 20-4.3-4.3" />
          </svg>
          <input
            type="text"
            placeholder="Search products, orders, customers…"
            [value]="searchQuery()"
            (input)="searchQuery.set($any($event.target).value)"
            (focus)="searchFocused.set(true)"
            (blur)="onSearchBlur()"
            class="bg-transparent text-sm text-(--primary) placeholder:text-[#8B8E9C] focus:outline-none flex-1!"
          />
        </label>

        @if (searchFocused() && searchQuery().trim().length > 0) {
          <div
            class="absolute left-0 right-0 top-[calc(100%+6px)] z-50 max-h-80 overflow-y-auto rounded-lg border bg-(--secondary) shadow-lg"
          >
            @if (searchResults().length > 0) {
              <ul class="divide-y divide-[#8B8E9C]/15">
                @for (result of searchResults(); track result.id) {
                  <li>
                    <button
                      type="button"
                      class="flex w-full items-center gap-3 px-3 py-2 text-left text-sm text-(--primary) hover:bg-[#8B8E9C]/10 transition-colors"
                    >
                      <span
                        class="shrink-0 rounded bg-[#8B8E9C]/15 px-1.5 py-0.5 text-[10px] uppercase tracking-wide text-[#8B8E9C]"
                      >
                        {{ result.category }}
                      </span>
                      <span class="truncate">{{ result.name }}</span>
                    </button>
                  </li>
                }
              </ul>
            } @else {
              <p class="px-3 py-4 text-center text-sm text-[#8B8E9C]">
                No results for "{{ searchQuery() }}"
              </p>
            }
          </div>
        }
      </div>
    </div>

    <!-- Actions -->
    <div class="flex shrink-0 items-center gap-1 lg:gap-2">
      <mat-icon class="lg:hidden!">search</mat-icon>

      <button
        class="xl:flex items-center text-sm font-medium transition-opacity hover:opacity-90 cursor-pointer"
        tuiChevron
        type="button"
        [attr.aria-expanded]="open()"
        [tuiDropdown]="dropdownContent"
        [tuiDropdownManual]="open()"
        [tuiObscuredEnabled]="open()"
        (click)="onClick()"
        (tuiActiveZoneChange)="onActiveZone($event)"
        (tuiObscured)="onObscured($event)"
      >
        <mat-icon>add</mat-icon>
        <ng-template #dropdownContent>
          <tui-data-list class="bg-(--theme)/50">
            @for (action of actions; track action.title) {
              <button tuiOption type="button" (click)="onSelect(action)">
                <div class="flex items-center justify-center gap-2">
                  <mat-icon class="scale-70">{{ action.icon }}</mat-icon>
                  <span tuiTitle class="text-sm!">
                    {{ action.title }}
                    <span tuiSubtitle class="text-xs!">{{ action.description }}</span>
                  </span>
                </div>
              </button>
            }
          </tui-data-list>
        </ng-template>
      </button>

      <button
        type="button"
        class="relative grid h-9 w-9 place-items-center rounded-md text-[#C9CBD4] hover:bg-[#232734]"
        aria-label="Notifications"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 9.5a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 13.5 6 9.5" />
          <path d="M10 19a2 2 0 0 0 4 0" />
        </svg>
        @if (notificationCount() > 0) {
          <span
            class="absolute right-1.5 top-1.5 grid h-4 w-4 place-items-center rounded-full bg-(--secondary) text-[10px] font-semibold text-[#1B1E27]"
          >
            {{ notificationCount() }}
          </span>
        }
      </button>

      <button
        type="button"
        class="grid h-9 w-9 place-items-center rounded-full bg-[#2E3240] text-sm font-medium text-[#ECEAE3] hover:opacity-90"
        aria-label="Account menu"
      >
        SA
      </button>
    </div>
  </div>
</header>
