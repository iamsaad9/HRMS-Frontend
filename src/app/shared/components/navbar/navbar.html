<header
  class="min-w-screen flex flex-col justify-between items-center gap-3 bg-linear-to-r from-(--theme1) via-(--theme2) to-(--theme3) px-5 py-2 text-(--background_light) shadow-lg rounded-b-xl h-14"
>
  <div class="flex justify-between items-center gap-3 xl:gap-5 w-full">
    <!-- Mobile menu toggle -->

    <button
      class="lg:hidden items-center text-sm font-medium transition-opacity hover:opacity-90 cursor-pointer"
      [attr.aria-expanded]="navMenuOpen()"
      [tuiDropdown]="dropdownNav"
      [tuiDropdownManual]="navMenuOpen()"
      [tuiObscuredEnabled]="navMenuOpen()"
      (click)="openNavMenu()"
      (tuiActiveZoneChange)="onActiveZone($event)"
      (tuiObscured)="onObscured($event)"
    >
      <mat-icon (click)="menuToggle.emit()">menu</mat-icon>
      <ng-template #dropdownNav>
        <tui-data-list class="bg-(--background_light)">
          @for (item of mockDropdownItems; track item.title) {
            <button tuiOption type="button">
              <app-dropdown-selector
                [dropDownItem]="item"
                [isMobile]="true"
                (closeMobile)="navMenuOpen.set(false)"
              />
            </button>
          }
        </tui-data-list>
      </ng-template>
    </button>

    <!-- Left Side -->
    <div class="flex gap-3 xl:gap-5">
      <!-- Logo -->
      <img
        src="https://as-suffa.org/wp-content/uploads/2021/04/as-suffa-master-logo.png"
        alt="Company_Logo"
        class="w-24 brightness-125 transition-transform hover:scale-105"
      />

      <!-- Navbar -->
      <nav class="hidden lg:flex gap-2 lg:gap-3 xl:gap-5 items-center">
        @for (item of mockDropdownItems; track item.title) {
          <app-dropdown-selector [dropDownItem]="item" />
        }
      </nav>
    </div>

    <!-- Right Side -->
    <div class="flex flex-1 gap-2 xl:gap-5 justify-end items-center">
      <tui-textfield
        iconStart="@tui.search"
        tuiTextfieldSize="s"
        class="flex flex-1 max-w-120 bg-(--secondary)/20! text-(--background_light)!"
      >
        <input
          placeholder="Search"
          class="text-(--background_light)! placeholder:text-(--background_light)!"
          tuiInput
          [(ngModel)]="searchQuery"
        />

        @if (searchResults().length > 0) {
          <tui-data-list
            *tuiDropdown
            class="z-10 w-full max-h-80 overflow-y-auto bg-(--background_light)"
          >
            @for (item of searchResults(); track item.id) {
              <button
                tuiOption
                type="button"
                (click)="handleItemClick(item)"
                class="flex flex-col items-start gap-0! p-2 hover:bg-(--theme2)/20! rounded-md transition-colors text-(--background_dark)!"
              >
                <!-- Title & Category Badge -->
                <div class="flex items-center justify-between w-full">
                  <span class="font-semibold text-sm">{{ item.name }}</span>
                  <span
                    class="text-[10px] px-2 py-0.5 bg-(--secondary)/50 text-(--theme2) rounded-full font-medium"
                  >
                    {{ item.category }}
                  </span>
                </div>

                <!-- Description -->
                <p class="text-xs text-left text-(--primary) line-clamp-1 w-full">
                  {{ item.description }}
                </p>
              </button>
            }
          </tui-data-list>
        }
      </tui-textfield>

      <!-- Actions -->
      <div class="flex shrink-0 items-center gap-1 lg:gap-2">
        <button
          class="xl:flex items-center text-sm font-medium transition-opacity hover:opacity-90 cursor-pointer"
          tuiChevron
          type="button"
          [attr.aria-expanded]="open()"
          [tuiDropdown]="dropdownContent"
          [tuiDropdownManual]="open()"
          [tuiObscuredEnabled]="open()"
          (click)="onClick()"
          (tuiActiveZoneChange)="onActiveZone($event)"
          (tuiObscured)="onObscured($event)"
        >
          <mat-icon>add</mat-icon>
          <ng-template #dropdownContent>
            <tui-data-list class="bg-(--background_light)!">
              @for (action of actions; track action.title) {
                <button
                  tuiOption
                  type="button"
                  class="hover:bg-(--theme2)/20!"
                  (click)="onSelect(action)"
                  [routerLink]="action.route"
                >
                  <div class="flex items-center justify-center gap-2 text-(--background_dark)!">
                    <mat-icon class="scale-70">{{ action.icon }}</mat-icon>
                    <span tuiTitle class="text-sm!">
                      {{ action.title }}
                      <span tuiSubtitle class="text-xs! text-(--primary)!">{{
                        action.description
                      }}</span>
                    </span>
                  </div>
                </button>
              }
            </tui-data-list>
          </ng-template>
        </button>

        <button
          type="button"
          class="relative grid h-9 w-9 place-items-center rounded-md cursor-pointer"
        >
          <mat-icon class="scale-80">notifications_none</mat-icon>
          @if (notificationCount() > 0) {
            <span
              class="absolute right-0.5 top-0.5 grid h-4 w-4 place-items-center rounded-full bg-(--theme2) text-[10px] font-semibold text-(--background_light)"
            >
              {{ notificationCount() }}
            </span>
          }
        </button>

        <button
          type="button"
          class="grid h-9 w-9 place-items-center rounded-full bg-[#2E3240] text-sm font-medium text-[#ECEAE3] hover:opacity-90"
          aria-label="Account menu"
        >
          SA
        </button>
      </div>
    </div>
  </div>
</header>
