  <div class="flex justify-between w-full items-center gap-3 xl:gap-5">
    <!-- Mobile menu toggle -->

    <button
      class="lg:hidden items-center text-sm font-medium transition-opacity hover:opacity-90 cursor-pointer"
      [attr.aria-expanded]="navMenuOpen()"
      [tuiDropdown]="dropdownNav"
      [tuiDropdownManual]="navMenuOpen()"
      [tuiObscuredEnabled]="navMenuOpen()"
      (click)="openNavMenu()"
      (tuiActiveZoneChange)="onActiveZone($event)"
      (tuiObscured)="onObscured($event)"
    >
      <mat-icon (click)="menuToggle.emit()">menu</mat-icon>
      <ng-template #dropdownNav>
        <tui-data-list class="bg-(--theme)/50">
          @for (item of mockDropdownItems; track item.title) {
            <button tuiOption type="button">
              <app-dropdown-selector [dropDownItem]="item" [isMobile]="true" />
            </button>
          }
        </tui-data-list>
      </ng-template>
    </button>

    <!-- Left Side -->
    <div class="flex gap-3 xl:gap-5">
      <!-- Logo -->
      <div class="hidden sm:flex shrink-0 items-center gap-2">
        <div
          class="grid h-8 w-8 place-items-center rounded-md bg-(--secondary) text-[#1B1E27] font-semibold"
        >
          S
        </div>
      </div>

      <!-- Navbar -->
      <nav class="hidden lg:flex gap-2 lg:gap-3 xl:gap-5 items-center">
        @for (item of mockDropdownItems; track item.title) {
          <app-dropdown-selector [dropDownItem]="item" />
        }
      </nav>
    </div>

    <!-- Right Side -->
    <div class="flex flex-1 gap-2 xl:gap-5 justify-end items-center">
      <tui-textfield
        iconStart="@tui.search"
        tuiTextfieldSize="s"
        class="flex flex-1 max-w-120 bg-(--secondary)! text-(--theme)!"
      >
        <input
          placeholder="Search"
          class="text-(--primary)! placeholder:text-(--primary)!"
          tuiInput
          [(ngModel)]="searchQuery"
        />

        @if (searchResults().length > 0) {
          <!-- 1. Use tui-data-list instead of tui-data-list-wrapper -->
          <tui-data-list *tuiDropdown class="z-10 w-full max-h-80 overflow-y-auto bg-(theme)!">
            @for (item of searchResults(); track item.id) {
              <button
                tuiOption
                type="button"
                (click)="handleItemClick(item)"
                class="flex flex-col items-start p-2 hover:bg-gray-100 rounded-md transition-colors"
              >
                <!-- Title & Category Badge -->
                <div class="flex items-center justify-between w-full">
                  <span class="font-semibold text-sm">{{ item.name }}</span>
                  <span
                    class="text-[10px] px-2 py-0.5 bg-(--secondary) text-(--theme) rounded-full font-medium"
                  >
                    {{ item.category }}
                  </span>
                </div>

                <!-- Description -->
                <p class="text-xs text-left text-(--secondary) line-clamp-1 w-full">
                  {{ item.description }}
                </p>
              </button>
            }
          </tui-data-list>
        }
      </tui-textfield>

      <!-- Actions -->
      <div class="flex shrink-0 items-center gap-1 lg:gap-2 text-(--background_light)">
        <button
          class="xl:flex items-center text-sm font-medium transition-opacity hover:opacity-90 cursor-pointer"
          tuiChevron
          type="button"
          [attr.aria-expanded]="open()"
          [tuiDropdown]="dropdownContent"
          [tuiDropdownManual]="open()"
          [tuiObscuredEnabled]="open()"
          (click)="onClick()"
          (tuiActiveZoneChange)="onActiveZone($event)"
          (tuiObscured)="onObscured($event)"
        >
          <mat-icon>add</mat-icon>
          <ng-template #dropdownContent>
            <tui-data-list class="bg-(--theme)! text-(--background_light)">
              @for (action of actions; track action.title) {
                <button
                  tuiOption
                  type="button"
                  (click)="onSelect(action)"
                  [routerLink]="action.route"
                >
                  <div class="flex items-center justify-center gap-2">
                    <mat-icon class="scale-70">{{ action.icon }}</mat-icon>
                    <span tuiTitle class="text-sm!">
                      {{ action.title }}
                      <span tuiSubtitle class="text-xs!">{{ action.description }}</span>
                    </span>
                  </div>
                </button>
              }
            </tui-data-list>
          </ng-template>
        </button>

        <button
          type="button"
          class="relative grid h-9 w-9 place-items-center rounded-md text-(--background_light) hover:bg-[#232734]"
          aria-label="Notifications"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 9.5a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 13.5 6 9.5" />
            <path d="M10 19a2 2 0 0 0 4 0" />
          </svg>
          @if (notificationCount() > 0) {
            <span
              class="absolute right-1.5 top-1.5 grid h-4 w-4 place-items-center rounded-full bg-(--secondary) text-[10px] font-semibold text-[#1B1E27]"
            >
              {{ notificationCount() }}
            </span>
          }
        </button>

        <button
          type="button"
          class="grid h-9 w-9 place-items-center rounded-full bg-[#2E3240] text-sm font-medium text-[#ECEAE3] hover:opacity-90"
          aria-label="Account menu"
        >
          SA
        </button>
      </div>
    </div>
  </div>
</header>
