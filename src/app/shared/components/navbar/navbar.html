<header
  class="min-w-screen flex flex-col justify-between items-center gap-3 bg-linear-to-r from-(--theme1) via-(--theme2) to-(--theme3) px-5 py-2 text-white shadow-lg rounded-b-xl h-14">
  <div class="flex justify-between items-center gap-3 xl:gap-5 w-full">
    <!-- Mobile menu toggle -->

    <button class="lg:hidden items-center text-sm font-medium transition-opacity hover:opacity-90 cursor-pointer"
      [attr.aria-expandRoutesed]="navMenuOpen()" [tuiDropdown]="dropdownNav" [tuiDropdownManual]="navMenuOpen()"
      [tuiObscuredEnabled]="navMenuOpen()" (click)="openNavMenu()" (tuiActiveZoneChange)="onActiveZone($event)"
      (tuiObscured)="onObscured($event)">
      <mat-icon (click)="menuToggle.emit()">menu</mat-icon>
      <ng-template #dropdownNav>
        <tui-data-list class="bg-(--background_light)">
          @for (item of allowedDropDownItems(); track item.title) {
          <button tuiOption type="button">
            <app-dropdown-selector [dropDownItem]="item" [isMobile]="true" (closeMobile)="navMenuOpen.set(false)" />
          </button>
          }
        </tui-data-list>
      </ng-template>
    </button>

    <!-- Left Side -->
    <div class="flex gap-3 xl:gap-5">
      <!-- Logo -->
      <img src="https://as-suffa.org/wp-content/uploads/2021/04/as-suffa-master-logo.png" alt="Company_Logo"
        class="w-24 brightness-125 transition-transform hover:scale-105" />

      <!-- Navbar -->
      <nav class="hidden lg:flex gap-2 lg:gap-3 xl:gap-5 items-center">
        @for (item of allowedDropDownItems(); track item.title) {
        <app-dropdown-selector [dropDownItem]="item" />
        }
      </nav>
    </div>

    <!-- Right Side -->
    <div class="flex flex-1 gap-2 xl:gap-5 justify-end items-center">

      <span [class]="
                'inline-flex items-center gap-1.5 px-2.5 py-2 rounded-full text-sm font-semibold border text-white ' +
                (attendanceService.hasOpenSession()
                  ? 'bg-emerald-900/50 border-emerald-500 '
                  : 'bg-red-900/50 border-red-700 ')
              ">
        <span [class]="
                  'w-2 h-2 rounded-full ' +
                  (attendanceService.hasOpenSession() ? 'bg-green-600 animate-pulse' :  'bg-red-500 animate-pulse')
                "></span>

        {{ attendanceService.isClockedIn() &&
        attendanceService.isClockedOut() ? 'Shift Ended' : attendanceService.isClockedIn() ? 'Clocked In' : 'Clocked
        Out' }}
      </span>

      <!-- Dark Mode -->
      <button tuiButton type="button" appearance="secondary" size="s" class="" (click)="themeService.toggleTheme()">
        @if (themeService.currentTheme() === 'light') {
        <tui-icon class="scale-90 cursor-pointer" icon="@tui.moon" />
        } @else {
        <tui-icon class="scale-90 cursor-pointer" icon="@tui.sun" />
        }
      </button>

      <div class="flex shrink-0 items-center gap-1 lg:gap-2">



        <button type="button"
          class="xl:flex items-center text-sm font-medium transition-opacity hover:opacity-90 cursor-pointer"
          [attr.aria-expanded]="userDropdownOpen()" [tuiDropdown]="userDropdownContent"
          [tuiDropdownManual]="userDropdownOpen()" [tuiObscuredEnabled]="userDropdownOpen()"
          (click)="openUserDropDown()" (tuiActiveZoneChange)="onActiveZone($event)" (tuiObscured)="onObscured($event)">
          <div size="m" tuiAvatar="@tui.user" tuiAvatarOutline="var(--theme1)" class="text-white! bg-black/20!">
            <img alt="Alex Inkin" src="" />
          </div>
          <ng-template #userDropdownContent>
            <tui-data-list class="bg-(--background_light)!">
              <button tuiOption type="button" class="hover:bg-(--primary)/10! border! border-(--accent)! border-dashed"
                (click)="userDropdownOpen.set(false)"
                [routerLink]="['/employee', currentUser?.employeeInfo?.id, 'view']">
                <div class="flex items-center gap-2 w-full text-(--background_dark)!">
                  <tui-icon class="scale-80 shrink-0 text-(--accent)" icon="@tui.user-round" />

                  <div class="flex items-center justify-between gap-3 w-full">
                    <!-- Left -->
                    <span tuiTitle class="text-sm! gap-0! text-(--accent) font-medium!">
                      {{ currentUser?.employeeInfo?.firstName }}
                      <span tuiSubtitle class="text-xs! text-(--primary)/50!">
                        {{ currentUser?.email }}
                      </span>
                    </span>

                    <!-- Right (Chips Array) -->
                    <div class="flex flex-wrap items-center justify-end gap-1.5 shrink-0">
                      @for (role of currentUser?.employeeInfo?.roles; track role) {
                      <span
                        class="rounded-full bg-(--primary)/10 px-2 py-0.5 text-[11px] font-medium text-(--primary) border border-(--primary)/20 whitespace-nowrap">
                        {{ role }}
                      </span>
                      }
                    </div>
                  </div>
                </div>
              </button>



              <button tuiOption type="button" class="hover:bg-(--error)!" (click)="onLogout()">
                <div class="flex items-center justify-center gap-2 text-(--background_dark)!">
                  <tui-icon class="scale-80 cursor-pointer" icon="@tui.log-out" />
                  <span tuiTitle class="text-sm! gap-0!">
                    Logout
                    <span tuiSubtitle class="text-xs! text-(--primary)/50!">Log out of current session</span>
                  </span>
                </div>
              </button>
            </tui-data-list>
          </ng-template>
        </button>
      </div>
    </div>
  </div>
</header>
